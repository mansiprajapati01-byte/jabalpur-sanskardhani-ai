<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabalpur AI - आपका स्मार्ट सर्च इंजन</title>
    <!-- Google Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #202124;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 25px;
            gap: 15px;
            font-size: 14px;
        }

        header a {
            text-decoration: none;
            color: #202124;
        }

        header a:hover {
            text-decoration: underline;
        }

        .badge {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
        }

        /* Main Logo Section */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .main-container.searched {
            justify-content: flex-start;
            padding-top: 20px;
        }

        /* Google Style Colorful Logo */
        .logo {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 25px;
            user-select: none;
            text-align: center;
        }

        .main-container.searched .logo {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .c-blue { color: #4285F4; }
        .c-red { color: #EA4335; }
        .c-yellow { color: #FBBC05; }
        .c-green { color: #34A853; }

        .sub-logo {
            font-size: 14px;
            color: #5f6368;
            margin-top: -18px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .main-container.searched .sub-logo {
            display: none;
        }

        /* Search Box */
        .search-wrapper {
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 50px;
            border: 1px solid #dfe1e5;
            border-radius: 25px;
            padding: 0 18px;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
            transition: box-shadow 0.2s;
            background: #fff;
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 2px 10px rgba(32,33,36,0.2);
            border-color: rgba(223,225,229,0);
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 0 12px;
            color: #202124;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #5f6368;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: #f1f3f4;
        }

        .mic-active {
            color: #EA4335 !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Quick Category Chips */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            max-width: 750px;
        }

        .chip {
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: #3c4043;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chip:hover {
            background-color: #e8f0fe;
            border-color: #1a73e8;
            color: #1a73e8;
        }

        /* Image Preview Area */
        #image-preview-container {
            display: none;
            margin-top: 15px;
            text-align: center;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed #4285F4;
            max-width: 650px;
            width: 100%;
        }

        #image-preview-container img {
            max-height: 150px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* Results Section */
        #results-area {
            width: 100%;
            max-width: 750px;
            margin-top: 30px;
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .result-card {
            background: #fff;
            border: 1px solid #dfe1e5;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }

        .result-card h3 {
            color: #1a0dab;
            font-size: 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .result-card p {
            color: #4d5156;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .info-list {
            list-style: none;
            margin-top: 10px;
        }

        .info-list li {
            padding: 10px 0;
            border-bottom: 1px solid #f1f3f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-list li:last-child {
            border-bottom: none;
        }

        .map-btn {
            background: #e8f0fe;
            color: #1a73e8;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .map-btn:hover {
            background: #d2e3fc;
        }

        .global-search-bar {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Footer */
        footer {
            background: #f2f2f2;
            padding: 15px 30px;
            font-size: 13px;
            color: #70757a;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .logo { font-size: 46px; }
            .sub-logo { margin-top: -12px; }
        }
    </style>
</head>
<body>

    <header>
        <span class="badge">📍 Jabalpur, MP (Live Agent)</span>
        <a href="https://google.com" target="_blank">जबलपुर न्यूज़</a>
        <a href="https://google.com" target="_blank">मैप (Maps)</a>
    </header>

    <div class="main-container" id="main-container">
        <!-- Google Style Logo -->
        <div class="logo">
            <span class="c-blue">J</span><span class="c-red">a</span><span class="c-yellow">b</span><span class="c-blue">a</span><span class="c-green">l</span><span class="c-red">p</span><span class="c-yellow">u</span><span class="c-blue">r</span>
            <span class="c-green">A</span><span class="c-red">I</span>
        </div>
        <div class="sub-logo">संस्कारधानी और पूरी दुनिया का स्मार्ट सर्च इंजन</div>

        <!-- Search Box -->
        <div class="search-wrapper">
            <div class="search-box">
                <span class="material-icons" style="color: #9aa0a6;">search</span>
                <input type="text" id="search-input" placeholder="जबलपुर या दुनिया के बारे में कुछ भी लिखें या बोलें..." onkeypress="handleEnter(event)">
                
                <!-- Voice Search Button -->
                <button class="icon-btn" id="mic-btn" onclick="startVoiceSearch()" title="बोलकर पूछें">
                    <span class="material-icons" style="color: #4285F4;">mic</span>
                </button>

                <!-- Photo Upload Button -->
                <button class="icon-btn" onclick="document.getElementById('image-upload').click()" title="फोटो से खोजें">
                    <span class="material-icons" style="color: #34A853;">photo_camera</span>
                </button>
                <input type="file" id="image-upload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            </div>
        </div>

        <!-- Image Preview Container -->
        <div id="image-preview-container">
            <img id="preview-img" src="" alt="Uploaded Image">
            <p id="image-status" style="font-size: 14px; color: #3c4043; font-weight: 500;"></p>
