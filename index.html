<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabalpur - आपका अपना स्मार्ट सर्च इंजन</title>
    <!-- आइकॉन्स के लिए FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #202124;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* टॉप नेविगेशन और ट्रांसलेटर */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            font-size: 14px;
        }
        .header-left a {
            text-decoration: none;
            color: #202124;
            margin-right: 15px;
            font-weight: 500;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #google_translate_element {
            display: inline-block;
        }

        /* मुख्य सर्च कंटेनर */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
        }
        .logo {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-top: 30px;
            margin-bottom: 25px;
            user-select: none;
            text-align: center;
        }
        /* Google जैसे रंग */
        .c-blue { color: #4285F4; }
        .c-red { color: #EA4335; }
        .c-yellow { color: #FBBC05; }
        .c-green { color: #34A853; }
        .sub-logo {
            font-size: 13px;
            color: #5f6368;
            letter-spacing: 1px;
            margin-top: -15px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* Google जैसा सर्च बार */
        .search-wrapper {
            width: 100%;
            max-width: 620px;
            position: relative;
        }
        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 50px;
            border: 1px solid #dfe1e5;
            border-radius: 25px;
            padding: 0 18px;
            box-shadow: 0 1px 6px rgba(32,33,36,0.12);
            transition: box-shadow 0.2s;
            background: #fff;
        }
        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 2px 10px rgba(32,33,36,0.22);
            border-color: rgba(223,225,229,0);
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 0 12px;
            color: #202124;
            background: transparent;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 19px;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .icon-btn:hover {
            background-color: #f1f3f4;
        }
        .mic-icon { color: #4285F4; }
        .mic-active { color: #EA4335; animation: pulse 1s infinite; }
        .cam-icon { color: #34A853; }
        .search-icon { color: #5f6368; font-size: 17px; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* क्विक कैटेगरी चिप्स (जबलपुर विशेष) */
        .quick-chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-width: 720px;
            margin-top: 25px;
        }
        .chip {
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13.5px;
            color: #3c4043;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip:hover {
            background-color: #e8f0fe;
            border-color: #4285F4;
            color: #1967d2;
        }

        /* रिजल्ट दिखाने का एरिया */
        #results-container {
            width: 100%;
            max-width: 720px;
            margin-top: 30px;
            display: none;
            flex-direction: column;
            gap: 16px;
        }
        .result-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .result-card h3 {
            color: #1a0dab;
            font-size: 19px;
            margin-bottom: 8px;
        }
        .result-card p {
            color: #4d5156;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #e8f0fe;
            color: #1967d2;
            text-decoration: none;
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 600;
        }
        .map-btn:hover {
            background-color: #d2e3fc;
        }
        .uploaded-preview {
            max-width: 180px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 2px solid #4285F4;
        }

        /* फुटर */
        footer {
            background-color: #f2f2f2;
            color: #70757a;
            padding: 15px 25px;
            font-size: 14px;
            border-top: 1px solid #dadce0;
            margin-top: 40px;
        }
        .footer-top {
            padding-bottom: 10px;
            border-bottom: 1px solid #dadce0;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- हेडर और भाषा अनुवाद (Translate) -->
    <header>
        <div class="header-left">
            <a href="#" onclick="resetHome()">होम</a>
            <a href="#" onclick="quickSearch('जबलपुर आज की ताजा खबर')">ताज़ा ख़बरें</a>
            <a href="#" onclick="quickSearch('जबलपुर मंडी भाव और सब्जी रेट')">मंडी भाव</a>
        </div>
        <div class="header-right">
            <!-- Google Translate विजेट -->
            <div id="google_translate_element"></div>
        </div>
    </header>

    <!-- मुख्य सर्च हिस्सा -->
    <main>
        <!-- Google स्टाइल रंगीन लोगो -->
        <div class="logo">
            <span class="c-blue">J</span><span class="c-red">a</span><span class="c-yellow">b</span><span class="c-blue">a</span><span class="c-green">l</span><span class="c-red">p</span><span class="c-yellow">u</span><span class="c-blue">r</span>
        </div>
        <div class="sub-logo">संस्कारधानी का स्मार्ट सर्च इंजन और टूरिस्ट गाइड</div>

        <!-- सर्च बार (लिखकर, बोलकर और फोटो से) -->
        <div class="search-wrapper">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="जबलपुर या दुनिया का कोई भी सवाल पूछें..." onkeypress="handleKeyPress(event)">
                
                <!-- 1. बोलकर सर्च करने का माइक आइकॉन -->
                <button class="icon-btn mic-icon" id="micBtn" onclick="startVoiceSearch()" title="बोलकर खोजें">
                    <i class="fas fa-microphone"></i>
                </button>

                <!-- 2. फोटो अपलोड करने का कैमरा आइकॉन -->
                <button class="icon-btn cam-icon" onclick="document.getElementById('imageInput').click()" title="फोटो से खोजें">
                    <i class="fas fa-camera"></i>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

                <!-- 3. सर्च करने का बटन -->
                <button class="icon-btn search-icon" onclick="performSearch()" title="सर्च करें">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- जबलपुर की प्रमुख श्रेणियां (एक क्लिक में जानकारी) -->
        <div class="quick-chips">
            <div class="chip" onclick="quickSearch('घूमने की बेस्ट जगहें')"><i class="fas fa-map-marked-alt" style="color:#EA4335;"></i> घूमने की जगहें</div>
            <div class="chip" onclick="quickSearch('जबलपुर के बेस्ट होटल')"><i class="fas fa-hotel" style="color:#4285F4;"></i> बेस्ट होटल</div>
            <div class="chip" onclick="quickSearch('फेमस खाना और स्ट्रीट फूड')"><i class="fas fa-utensils" style="color:#FBBC05;"></i> फेमस फूड</div>
            <div class="chip" onclick="quickSearch('प्रसिद्ध मंदिर')"><i class="fas fa-om" style="color:#FF6D00;"></i> प्रसिद्ध मंदिर</div>
            <div class="chip" onclick="quickSearch('बेस्ट कॉलेज और स्कूल')"><i class="fas fa-graduation-cap" style="color:#34A853;"></i> स्कूल और कॉलेज</div>
            <div class="chip" onclick="quickSearch('बेस्ट डॉक्टर और अस्पताल')"><i class="fas fa-hospital" style="color:#EA4335;"></i> डॉक्टर और अस्पताल</div>
